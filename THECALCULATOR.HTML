<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Ball Power Level Calculator</title>
  <style>
body{
 font-family: Arial;
   background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .scouter-box {
      background-color: #1e1e1e;
      border: 2px solid #ff9800;
      border-radius: 12px;
      padding: 30px;
      width: 340px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 152, 0, 0.3);
    }
    h1 {
      color: #ff9800;
      font-size: 22px;
      margin-bottom: 20px;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background-color: #ff9800;
      color: #121212;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #ffb74d;
    }
    .result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #ffeb3b;
    }
  </style>
</head>
<body>

  <div class="scouter-box">
    <h1>Power Level Scouter</h1>
    
    <input type="number" id="basePower" placeholder="Enter base power (e.g. 6000)" value="1000">
    
    <select id="formMultiplier">
      <option value="10">Great Ape (×10)</option>
      <option value="25">False Super Saiyan (×25)</option>
      <option value="50">Super Saiyan (×50)</option>
      <option value="62.5">Super Saiyan Grade 2 (×62.5)</option>
      <option value="75">Super Saiyan Grade 3 (×75)</option>
      <option value="100">Super Saiyan 2 (×100)</option>
      <option value="400" selected>Super Saiyan 3 (×400)</option>
       <option value="32000" selected>Super Saiyan 4 (×32000)</option>
      <option value="20000" selected>Super Saiyan God (×20000)</option>
      <option value="1000000" selected>Super Saiyan Blue (×1M)</option>
    </select>
    
    <button onclick="calculatePower()">Calculate</button>
    
    <div class="result" id="output">2,400,000</div>
  </div>

  <script>
    function calculatePower() {
      const base = parseFloat(document.getElementById('basePower').value) || 0;
      const multiplier = parseFloat(document.getElementById('formMultiplier').value);
      const total = base * multiplier;
      
      document.getElementById('output').innerText = total.toLocaleString();
    }
  </script>

</body>
</html>
